<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube View Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0d0d0f url('./musztarda.jpg') center center / cover fixed no-repeat;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

h1{
  font-size:25px;
  margin:0 0 5px;
}

.sub{
  color:#bbb;
  font-size:14px;
}

.badge{
  font-size:12px;
  color:#aaa;
  border:1px solid #444;
  border-radius:20px;
  padding:7px 10px;
  background:rgba(0,0,0,.55);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}

.card,
.panel{
  background:rgba(23,23,25,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
}

.card{
  padding:15px;
}

.label{
  font-size:12px;
  color:#999;
  margin-bottom:7px;
}

.value{
  font-size:24px;
  font-weight:700;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.range-btn{
  background:rgba(23,23,25,.9);
  color:#aaa;
  border:1px solid #333;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-size:13px;
}

.range-btn:hover{
  background:#222;
  color:#fff;
}

.range-btn.active{
  background:#fff;
  color:#111;
  border-color:#fff;
}

.panel{
  padding:18px;
  margin-bottom:16px;
}

.panel-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
}

.chart-wrap{
  width:100%;
  overflow-x:auto;
}

canvas{
  display:block;
  width:100%;
  height:480px;
  min-width:700px;
}

.empty{
  text-align:center;
  padding:170px 10px;
  color:#777;
}

.status{
  margin-top:10px;
  color:#888;
  font-size:13px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  text-align:left;
  color:#888;
  font-weight:normal;
  padding:10px;
  border-bottom:1px solid #333;
}

td{
  padding:10px;
  border-bottom:1px solid #29292c;
}

tr.spike{
  background:rgba(255,255,255,.08);
}

.gain-positive{
  color:#fff;
  font-weight:700;
}

/* Easter egg */
#easterEgg{
  position:fixed;
  top:14px;
  left:14px;
  width:70px;
  height:70px;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
  z-index:9999;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 4px 15px rgba(0,0,0,.5);
  transition:transform .15s ease;
}

#easterEgg:hover{
  transform:scale(1.08);
}

#easterEgg:active{
  transform:scale(.95);
}

#easterEgg img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

@media(max-width:750px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  #easterEgg{
    width:55px;
    height:55px;
    top:10px;
    left:10px;
  }
}
</style>
</head>

<body>

<!-- Easter egg -->
<div id="easterEgg" title="...">
  <img src="./face.png" alt="">
</div>

<audio id="easterEggSound" preload="auto">
  <source src="./easteregg.mp3" type="audio/mpeg">
</audio>

<div class="wrap">

  <div class="top">
    <div>
      <h1>YouTube View Tracker</h1>
      <div class="sub">yyV-vSH1sSY · automatic 60-second refresh</div>
    </div>

    <div class="badge" id="connection">
      Waiting for views.csv…
    </div>
  </div>

  <div class="stats">
    <div class="card">
      <div class="label">CURRENT VIEWS</div>
      <div class="value" id="current">—</div>
    </div>

    <div class="card">
      <div class="label">VIEWS GAINED</div>
      <div class="value" id="gained">—</div>
    </div>

    <div class="card">
      <div class="label">VIEWS / HOUR</div>
      <div class="value" id="rate">—</div>
    </div>

    <div class="card">
      <div class="label">TRACKING TIME</div>
      <div class="value" id="duration">—</div>
    </div>
  </div>

  <div class="controls">
    <button class="range-btn" data-range="30m">Last 30 minutes</button>
    <button class="range-btn" data-range="1h">Last hour</button>
    <button class="range-btn" data-range="6h">Last 6 hours</button>
    <button class="range-btn" data-range="24h">Last 24 hours</button>
    <button class="range-btn" data-range="7d">Last 7 days</button>
    <button class="range-btn active" data-range="all">All time</button>
  </div>

  <div class="panel">
    <div class="panel-title">Total Views</div>

    <div id="empty" class="empty">
      Waiting for <b>views.csv</b> in this directory…
    </div>

    <div class="chart-wrap">
      <canvas id="chart" hidden></canvas>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Views Gained Between Updates</div>

    <div class="chart-wrap">
      <canvas id="gainChart"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Recorded Updates</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Total Views</th>
            <th>Views Gained</th>
          </tr>
        </thead>
        <tbody id="dataTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
(() => {

  /* =========================
     EASTER EGG
     ========================= */

  const easterEgg = document.getElementById('easterEgg');
  const easterEggSound = document.getElementById('easterEggSound');

  easterEgg.addEventListener('click', () => {

    easterEggSound.currentTime = 0;

    easterEggSound.play().catch(error => {
      console.log('Could not play easter egg sound:', error);
    });

  });


  /* =========================
     VIEW TRACKER
     ========================= */

  const csvURL = './views.csv';

  const canvas = document.getElementById('chart');
  const gainCanvas = document.getElementById('gainChart');

  const ctx = canvas.getContext('2d');
  const gainCtx = gainCanvas.getContext('2d');

  const empty = document.getElementById('empty');

  let allRows = [];
  let selectedRange = 'all';

  const number = n =>
    Number(n).toLocaleString('en-GB');

  const shortNumber = n => {
    if(Math.abs(n) >= 1e9)
      return (n/1e9).toFixed(1)+'B';

    if(Math.abs(n) >= 1e6)
      return (n/1e6).toFixed(1)+'M';

    if(Math.abs(n) >= 1e3)
      return (n/1e3).toFixed(1)+'K';

    return Math.round(n).toString();
  };

  function parseCSV(text){

    const lines = text.trim().split(/\r?\n/);

    if(lines.length < 2)
      return [];

    const headers =
      lines[0].split(',').map(x => x.trim());

    return lines.slice(1).map(line => {

      const vals = [];
      let cur = '';
      let quote = false;

      for(const c of line){

        if(c === '"'){
          quote = !quote;
          continue;
        }

        if(c === ',' && !quote){
          vals.push(cur);
          cur = '';
        }else{
          cur += c;
        }
      }

      vals.push(cur);

      const o = {};

      headers.forEach((h,i) => {
        o[h] = vals[i] ?? '';
      });

      return {
        date:new Date(o.timestamp),
        views:Number(o.views)
      };

    }).filter(x =>
      !isNaN(x.date) &&
      Number.isFinite(x.views)
    );
  }

  function filterRows(rows){

    if(selectedRange === 'all')
      return [...rows];

    const last =
      rows.at(-1).date.getTime();

    const durations = {
      '30m':30 * 60 * 1000,
      '1h':60 * 60 * 1000,
      '6h':6 * 60 * 60 * 1000,
      '24h':24 * 60 * 60 * 1000,
      '7d':7 * 24 * 60 * 60 * 1000
    };

    const start =
      last - durations[selectedRange];

    return rows.filter(r =>
      r.date.getTime() >= start
    );
  }

  function setupCanvas(c){

    const dpr =
      window.devicePixelRatio || 1;

    const rect =
      c.getBoundingClientRect();

    const W =
      Math.max(rect.width,700);

    const H = 480;

    c.width = W * dpr;
    c.height = H * dpr;

    const context =
      c.getContext('2d');

    context.setTransform(
      dpr,0,0,dpr,0,0
    );

    return {
      context,
      W,
      H
    };
  }

  function drawTotalChart(rows){

    if(!rows.length){

      empty.hidden = false;
      canvas.hidden = true;

      return;
    }

    empty.hidden = true;
    canvas.hidden = false;

    const {
      context:c,
      W,
      H
    } = setupCanvas(canvas);

    const left=70;
    const right=22;
    const top=25;
    const bottom=55;

    const pw=W-left-right;
    const ph=H-top-bottom;

    const min=Math.min(
      ...rows.map(r=>r.views)
    );

    const max=Math.max(
      ...rows.map(r=>r.views)
    );

    const range=Math.max(
      max-min,
      1
    );

    const lo=Math.max(
      0,
      min-range*.08
    );

    const hi=max+range*.08;

    const x=i =>
      left +
      (rows.length===1
        ? pw/2
        : i/(rows.length-1)*pw);

    const y=v =>
      top +
      (1-(v-lo)/(hi-lo))*ph;

    c.clearRect(0,0,W,H);

    c.font='12px Arial';

    for(let i=0;i<=5;i++){

      const yy =
        top+i*ph/5;

      const val =
        hi-(hi-lo)*i/5;

      c.strokeStyle='#29292c';
      c.lineWidth=1;

      c.beginPath();
      c.moveTo(left,yy);
      c.lineTo(W-right,yy);
      c.stroke();

      c.fillStyle='#888';
      c.textAlign='right';

      c.fillText(
        shortNumber(val),
        left-9,
        yy+4
      );
    }

    const grad =
      c.createLinearGradient(
        0,top,
        0,top+ph
      );

    grad.addColorStop(
      0,
      'rgba(255,255,255,.15)'
    );

    grad.addColorStop(
      1,
      'rgba(255,255,255,0)'
    );

    c.beginPath();

    rows.forEach((r,i) =>
      i
      ? c.lineTo(x(i),y(r.views))
      : c.moveTo(x(i),y(r.views))
    );

    c.lineTo(
      x(rows.length-1),
      top+ph
    );

    c.lineTo(
      x(0),
      top+ph
    );

    c.closePath();

    c.fillStyle=grad;
    c.fill();

    c.beginPath();

    rows.forEach((r,i) =>
      i
      ? c.lineTo(x(i),y(r.views))
      : c.moveTo(x(i),y(r.views))
    );

    c.strokeStyle='#fff';
    c.lineWidth=2.5;
    c.stroke();

    c.fillStyle='#888';
    c.textAlign='left';

    c.fillText(
      rows[0].date.toLocaleString('en-GB'),
      left,
      H-20
    );

    c.textAlign='right';

    c.fillText(
      rows.at(-1).date.toLocaleString('en-GB'),
      W-right,
      H-20
    );
  }

  function drawGainChart(rows){

    if(!rows.length)
      return;

    const {
      context:c,
      W,
      H
    } = setupCanvas(gainCanvas);

    const left=70;
    const right=22;
    const top=25;
    const bottom=55;

    const pw=W-left-right;
    const ph=H-top-bottom;

    const gains=rows.map((r,i) => {

      if(i === 0)
        return 0;

      return r.views -
             rows[i-1].views;
    });

    const max=Math.max(
      ...gains,
      1
    );

    const min=Math.min(
      ...gains,
      0
    );

    const range=Math.max(
      max-min,
      1
    );

    const lo=min-range*.08;
    const hi=max+range*.08;

    const x=i =>
      left +
      (gains.length===1
        ? pw/2
        : i/(gains.length-1)*pw);

    const y=v =>
      top +
      (1-(v-lo)/(hi-lo))*ph;

    c.clearRect(0,0,W,H);

    c.font='12px Arial';

    for(let i=0;i<=5;i++){

      const yy =
        top+i*ph/5;

      const val =
        hi-(hi-lo)*i/5;

      c.strokeStyle='#29292c';
      c.lineWidth=1;

      c.beginPath();
      c.moveTo(left,yy);
      c.lineTo(W-right,yy);
      c.stroke();

      c.fillStyle='#888';
      c.textAlign='right';

      c.fillText(
        shortNumber(val),
        left-9,
        yy+4
      );
    }

    const zeroY=y(0);

    c.strokeStyle='#555';
    c.lineWidth=1.5;

    c.beginPath();
    c.moveTo(left,zeroY);
    c.lineTo(W-right,zeroY);
    c.stroke();

    c.beginPath();

    gains.forEach((g,i) =>
      i
      ? c.lineTo(x(i),y(g))
      : c.moveTo(x(i),y(g))
    );

    c.strokeStyle='#fff';
    c.lineWidth=2;
    c.stroke();

    gains.forEach((g,i)=>{

      c.beginPath();

      c.arc(
        x(i),
        y(g),
        Math.abs(g)>1000 ? 5 : 3,
        0,
        Math.PI*2
      );

      c.fillStyle =
        Math.abs(g)>1000
        ? '#fff'
        : '#aaa';

      c.fill();
    });

    c.fillStyle='#888';
    c.textAlign='left';

    c.fillText(
      rows[0].date.toLocaleString('en-GB'),
      left,
      H-20
    );

    c.textAlign='right';

    c.fillText(
      rows.at(-1).date.toLocaleString('en-GB'),
      W-right,
      H-20
    );
  }

  function drawTable(rows){

    const tbody =
      document.getElementById(
        'dataTable'
      );

    tbody.innerHTML='';

    [...rows].reverse().forEach(row=>{

      const globalIndex =
        allRows.indexOf(row);

      const previous =
        globalIndex > 0
        ? allRows[globalIndex-1]
        : null;

      const gain =
        previous
        ? row.views-previous.views
        : 0;

      const tr =
        document.createElement('tr');

      if(gain >= 1000)
        tr.className='spike';

      tr.innerHTML=`
        <td>
          ${row.date.toLocaleString('en-GB')}
        </td>

        <td>
          ${number(row.views)}
        </td>

        <td class="gain-positive">
          ${gain >= 0 ? '+' : ''}
          ${number(gain)}
        </td>
      `;

      tbody.appendChild(tr);
    });
  }

  function updateStats(){

    if(!allRows.length)
      return;

    const first=allRows[0];
    const last=allRows.at(-1);

    const gained =
      last.views-first.views;

    const hours =
      (last.date-first.date)/3600000;

    document.getElementById(
      'current'
    ).textContent=
      number(last.views);

    document.getElementById(
      'gained'
    ).textContent=
      number(gained);

    document.getElementById(
      'rate'
    ).textContent=
      hours>0
      ? number(Math.round(gained/hours))
      : '—';

    document.getElementById(
      'duration'
    ).textContent=
      hours<1
      ? Math.round(hours*60)+'m'
      : hours<24
      ? hours.toFixed(1)+'h'
      : (hours/24).toFixed(1)+'d';

    document.getElementById(
      'connection'
    ).textContent=
      'Live · updated '+
      last.date.toLocaleTimeString(
        'en-GB',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      );
  }

  function draw(){

    const rows =
      filterRows(allRows);

    updateStats();

    drawTotalChart(rows);
    drawGainChart(rows);
    drawTable(rows);

    document.getElementById(
      'status'
    ).textContent=
      `${allRows.length} data points · Automatically checking views.csv every 60 seconds`;
  }

  async function refresh(){

    try{

      const response =
        await fetch(
          csvURL+'?t='+Date.now(),
          {
            cache:'no-store'
          }
        );

      if(!response.ok)
        throw new Error(
          'HTTP '+response.status
        );

      const text =
        await response.text();

      allRows=parseCSV(text);

      allRows.sort(
        (a,b)=>a.date-b.date
      );

      draw();

    }catch(e){

      document.getElementById(
        'connection'
      ).textContent=
        'Waiting for views.csv…';

      if(!canvas.hidden){

        document.getElementById(
          'status'
        ).textContent=
          'Could not read views.csv — '+
          e.message;
      }
    }
  }

  document
    .querySelectorAll('.range-btn')
    .forEach(button=>{

      button.addEventListener(
        'click',
        ()=>{

          selectedRange =
            button.dataset.range;

          document
            .querySelectorAll('.range-btn')
            .forEach(b =>
              b.classList.remove('active')
            );

          button.classList.add('active');

          draw();
        }
      );
    });

  refresh();

  setInterval(
    refresh,
    60000
  );

  window.addEventListener(
    'resize',
    refresh
  );

})();
</script>

</body>
</html>
